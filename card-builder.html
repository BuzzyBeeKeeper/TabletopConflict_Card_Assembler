<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unit Card Builder</title>
<style>
  :root{
    --page-bg:#232226;
    --panel:#ffffff;
    --panel-2:#f2f2ef;
    --line:#dcdcd6;
    --line-soft:#e8e8e3;
    --text:#17171a;
    --text-dim:#6b6b6f;
    --page-text:#d9d5c9;
    --page-text-dim:#948d7a;
    --accent:#e8912e;
    --accent-dim:#f3c281;
    --danger:#c94a4a;
    --radius:6px;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;background:var(--page-bg);color:var(--page-text);
    min-height:100vh;
  }
  body{
    padding:28px 16px 80px;
    display:flex;flex-direction:column;align-items:center;
    gap:20px;
    position:relative;
    overflow-x:auto;
  }

  /* ---- DECORATIVE PAGE FRAME ---- */
  .page-frame{
    position:fixed;inset:14px;border:1.5px solid rgba(200,150,60,.55);
    border-radius:18px;pointer-events:none;
  }
  .frame-corner{
    position:fixed;width:32px;height:32px;border:2.5px solid var(--accent);
    opacity:.85;pointer-events:none;
  }
  .corner-tl{top:26px;left:26px;border-right:none;border-bottom:none;border-radius:8px 0 0 0;}
  .corner-tr{top:26px;right:26px;border-left:none;border-bottom:none;border-radius:0 8px 0 0;}
  .corner-bl{bottom:26px;left:26px;border-right:none;border-top:none;border-radius:0 0 0 8px;}
  .corner-br{bottom:26px;right:26px;border-left:none;border-top:none;border-radius:0 0 8px 0;}
  .frame-emblem{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    width:52px;height:52px;border:1.5px solid rgba(200,150,60,.6);border-radius:50%;
    display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:-1;
  }
  .frame-emblem::before{
    content:'';width:14px;height:14px;background:var(--accent);opacity:.85;
    transform:rotate(45deg);border-radius:2px;
  }

  .toolbar-hint{
    color:var(--page-text-dim);
    font-size:12.5px;
    max-width:1410px;
    width:100%;
    letter-spacing:.02em;
    display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:8px;
  }
  .toolbar-hint b{color:var(--accent);font-weight:600;}
  .global-btns{display:flex;gap:8px;}
  .gbtn{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:7px 12px;border-radius:var(--radius);font-size:12px;cursor:pointer;
    letter-spacing:.04em;text-transform:uppercase;
  }
  .gbtn:hover{border-color:var(--accent);color:var(--accent);}

  /* ===== CARD ===== */
  .card{
    width:1410px;flex-shrink:0;
    background:var(--panel);color:var(--text);
    border:2px solid var(--accent);
    border-radius:12px;
    display:flex;
    flex-direction:row;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.4);
  }
  .card.no-passives #passivesCol{display:none;}

  .col{
    display:flex;flex-direction:column;min-width:0;
    border-right:1px solid var(--line);
  }
  .col:last-child{border-right:none;}
  .art-col{width:420px;flex:0 0 420px;}
  .passives-col{width:380px;flex:0 0 380px;}
  .main-col{flex:1 1 0%;min-width:0;}

  /* ---- ART COLUMN ---- */
  .art-col{background:var(--panel);}
  .art-frame{
    position:relative;width:100%;flex:0 0 auto;aspect-ratio:1/1;min-height:0;
    background:
      linear-gradient(135deg,#e4e4de 25%,transparent 25%) -10px 0/20px 20px,
      linear-gradient(225deg,#e4e4de 25%,transparent 25%) -10px 0/20px 20px,
      linear-gradient(45deg,#e4e4de 25%,transparent 25%) 0 0/20px 20px,
      linear-gradient(315deg,#e4e4de 25%,#eeeeea 25%) 0 0/20px 20px;
    overflow:hidden;cursor:grab;user-select:none;
    border-bottom:1px solid var(--line);
  }
  .art-frame.dragging{cursor:grabbing;}
  #card.type-wide-art .art-frame{flex:0 0 auto;aspect-ratio:4/3;}
  #card.type-wide-art .art-col{width:460px;flex:0 0 460px;}
  .art-placeholder{
    position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;
    align-items:center;justify-content:center;color:var(--text-dim);
    font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    text-align:center;padding:20px;
  }
  .art-placeholder svg{opacity:.5;}
  .art-remove-btn{
    position:absolute;top:8px;right:8px;z-index:5;
    background:rgba(5,5,6,.75);border:1px solid var(--line);color:var(--text);
    width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:14px;
    display:flex;align-items:center;justify-content:center;
  }
  .art-remove-btn:hover{border-color:var(--danger);color:var(--danger);}
  .art-controls{
    display:flex;align-items:center;gap:8px;padding:8px 12px;
    background:var(--panel-2);border-bottom:1px solid var(--line);
  }
  .art-controls span{font-size:10px;color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase;}
  .art-controls input[type=range]{flex:1;accent-color:var(--accent);}

  .heat-track{
    display:none;align-items:center;gap:8px;
    padding:10px 10px 0;
  }
  body.battletech-enabled .heat-track{display:flex;}
  .heat-track-bar{
    display:flex;flex:1;height:38px;
    border:1.5px solid var(--accent-dim);border-radius:6px;overflow:hidden;
    background:#000;
  }
  .heat-slot{
    flex:1;min-width:0;position:relative;
    background:#000;border-right:1.5px solid var(--accent-dim);
  }
  .heat-slot:last-child{border-right:none;}
  .heat-slot .slot-remove{
    position:absolute;top:-9px;right:1px;width:14px;height:14px;border-radius:50%;
    background:var(--panel);border:1px solid var(--line);color:var(--text-dim);
    font-size:9px;line-height:12px;text-align:center;cursor:pointer;display:none;padding:0;z-index:2;
  }
  .heat-slot:hover .slot-remove{display:block;}
  .heat-add-tile{
    width:32px;height:38px;flex-shrink:0;border:1px dashed var(--line);border-radius:6px;
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);
    cursor:pointer;font-size:16px;background:none;
  }
  .heat-add-tile:hover{border-color:var(--accent);color:var(--accent);}

  .icon-strip{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;
    flex:0 0 auto;
    background:var(--panel-2);border-top:1px solid var(--line);
  }
  .icon-slot{
    position:relative;aspect-ratio:1/1;background:var(--panel-2);
    border:1px solid var(--line);border-radius:5px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .icon-slot .plus{color:var(--text-dim);font-size:20px;}
  .icon-slot .slot-x{
    position:absolute;top:2px;right:2px;background:rgba(5,5,6,.8);
    color:var(--text);border:none;border-radius:50%;width:16px;height:16px;
    font-size:10px;line-height:16px;cursor:pointer;display:none;
  }
  .icon-slot:hover .slot-x{display:block;}
  .add-icon-tile{
    aspect-ratio:1/1;border:1px dashed var(--line);border-radius:5px;
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);
    cursor:pointer;font-size:18px;background:transparent;
  }
  .add-icon-tile:hover{border-color:var(--accent);color:var(--accent);}

  /* ---- MAIN COLUMN ---- */
  .main-col{background:var(--panel);}
  .header{padding:20px 22px 14px;border-bottom:1px solid var(--line);}
  #unitName{
    font-family:Georgia,'Times New Roman',serif;
    font-size:34px;font-weight:700;letter-spacing:.01em;margin:0 0 6px;
    outline:none;color:var(--text);cursor:text;
  }
  #unitName:empty:before{content:'Unit Name';color:var(--text-dim);}
  .subtitle-row{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
  }
  .subtitle-row select{
    background:transparent;border:1px solid var(--accent-dim);color:var(--accent);
    font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:4px 6px;
    border-radius:4px;cursor:pointer;
  }
  .type-label-export{
    display:none;background:transparent;border:1px solid var(--accent-dim);color:var(--accent);
    font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:4px 6px;
    border-radius:4px;
  }
  #card.exporting .subtitle-row select{display:none;}
  #card.exporting .type-label-export{display:inline-block;}
  .subtitle-row .dot{color:var(--text-dim);}
  #subtitleText{outline:none;cursor:text;color:var(--text-dim);min-width:40px;}
  #subtitleText:empty:before{content:'faction / detail';}

  .stats-row{
    display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line);
  }
  .stat-block{
    flex:1;min-width:90px;padding:14px 8px;text-align:center;
    border-right:1px solid var(--line-soft);position:relative;
  }
  .stat-block:hover .stat-x{display:block;}
  .stat-x{
    position:absolute;top:4px;right:4px;background:none;border:none;color:var(--text-dim);
    cursor:pointer;font-size:11px;display:none;
  }
  .stat-icon{
    width:60px;height:60px;border-radius:50%;background:var(--accent-dim);
    border:2px solid var(--accent);margin:0 auto 8px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;overflow:hidden;color:#7a5a1f;font-size:16px;
  }
  .stat-value{
    font-size:19px;font-weight:700;outline:none;cursor:text;color:var(--text);
  }
  .stat-label{
    font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);
    margin-top:2px;outline:none;cursor:text;
  }
  .add-stat-tile{
    min-width:60px;border-right:1px solid var(--line-soft);display:flex;
    align-items:center;justify-content:center;color:var(--text-dim);cursor:pointer;
    font-size:18px;background:none;border-top:none;border-bottom:none;border-left:none;
  }
  .add-stat-tile:hover{color:var(--accent);}

  .abilities-section{padding:16px 22px 20px;flex:1;display:flex;flex-direction:column;min-height:0;}
  #abilitiesList{
    max-height:560px;overflow-y:auto;padding-right:6px;margin-bottom:10px;
  }
  #abilitiesList::-webkit-scrollbar{width:7px;}
  #abilitiesList::-webkit-scrollbar-track{background:transparent;}
  #abilitiesList::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
  #abilitiesList::-webkit-scrollbar-thumb:hover{background:var(--accent-dim);}
  .section-label{
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-dim);
    margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;
  }
  .ability-card{
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;margin-bottom:10px;position:relative;
    transition:background .15s ease;
  }
  .ability-color-btn{
    position:absolute;top:8px;right:32px;width:18px;height:18px;border-radius:50%;
    border:1.5px solid var(--line);cursor:pointer;padding:0;overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
    display:none;
  }
  body.colored-abilities .ability-color-btn{display:block;}
  .ability-color-btn input[type=color]{
    position:absolute;top:-4px;left:-4px;width:26px;height:26px;opacity:0;cursor:pointer;
  }
  .ability-top{display:flex;align-items:flex-start;gap:12px;}
  .ability-icon{
    width:76px;height:76px;background:#000;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;
    color:var(--text-dim);font-size:12px;flex-shrink:0;
  }
  .ability-icon.shape-square{border-radius:8px;}
  .ability-icon.shape-circle{border-radius:50%;}
  .ability-headline{flex:1;min-width:0;}
  .ability-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ability-name{
    font-family:Georgia,'Times New Roman',serif;font-size:19.5px;font-weight:700;
    outline:none;cursor:text;
  }
  .ability-tag{
    background:var(--accent);color:#0a0a0b;font-size:11px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:10px;
    outline:none;cursor:text;
  }
  .ability-remove{
    position:absolute;top:8px;right:8px;background:none;border:none;color:var(--text-dim);
    cursor:pointer;font-size:15px;
  }
  .ability-remove:hover{color:var(--danger);}

  /* ---- TRAIT: a faction/class-level standout, distinct from a regular
     square ability or circular passive. Uses clip-path to cut the icon box
     into a diamond while keeping its background-image upright (the image is
     rendered as a background-image directly on this box, not a child <img>,
     so rotating the box itself would rotate the photo sideways too). */
  .ability-card.trait{
    background:var(--panel-2);
    border:3px solid var(--accent);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.5), 0 0 0 1px rgba(232,145,46,.25), 0 6px 20px rgba(232,145,46,.35);
  }
  .trait-toggle{
    position:absolute;top:4px;right:76px;z-index:6;
    background:var(--panel);border:1.5px solid var(--line);
    color:var(--text-dim);cursor:pointer;font-size:16px;
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;
    border-radius:50%;
  }
  .trait-toggle:hover{border-color:var(--accent);color:var(--accent);}
  .trait-toggle.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .trait-badge{
    display:none;position:absolute;top:-11px;left:16px;z-index:3;
    background:linear-gradient(90deg, var(--accent) 0%, #d67a1a 100%);
    color:#fff;font-size:9.5px;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;padding:4px 16px;
    clip-path:polygon(6% 0%, 100% 0%, 94% 100%, 0% 100%);
    outline:none;cursor:text;box-shadow:0 3px 8px rgba(0,0,0,.3);
  }
  .trait-badge::before, .trait-badge::after{
    content:'◆';position:absolute;top:2px;color:#fff;font-size:7px;opacity:.85;
  }
  .trait-badge::before{left:4px;}
  .trait-badge::after{right:4px;}
  .ability-card.trait .trait-badge:not(:empty){display:block;}
  .ability-card.trait .ability-top{position:relative;}
  .ability-card.trait .ability-icon{
    border-radius:0;width:88px;height:88px;
    clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    box-shadow:0 0 0 3px var(--accent-dim), 0 0 22px 4px rgba(232,145,46,.55);
  }
  .ability-card.trait .ability-name{
    color:#7a4a10;text-shadow:0 1px 0 rgba(255,255,255,.4);
  }
  .ability-card.trait .shape-toggle{display:none;}

  .stat-columns{
    display:flex;flex-wrap:nowrap;gap:1px;margin-top:10px;background:#000;
    border:1px solid #000;border-radius:4px;overflow-x:auto;overflow-y:hidden;
  }
  .stat-columns::-webkit-scrollbar{height:6px;}
  .stat-columns::-webkit-scrollbar-track{background:#000;}
  .stat-columns::-webkit-scrollbar-thumb{background:#555;border-radius:6px;}
  .stat-columns::-webkit-scrollbar-thumb:hover{background:#777;}
  .stat-col{
    background:#000;color:#fff;flex:1 0 auto;min-width:66px;text-align:center;
    padding:12px 7px;position:relative;
  }
  .stat-col:hover .col-x{display:block;}
  .col-x{
    position:absolute;top:1px;right:2px;background:none;border:none;color:#777;
    font-size:10px;cursor:pointer;display:none;
  }
  .stat-col .cval{font-size:23px;font-weight:800;outline:none;cursor:text;}
  .stat-col .clabel{
    font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#bbb;
    margin-top:3px;outline:none;cursor:text;
  }
  .add-col-btn{
    background:#000;color:#666;border:none;flex:0 0 30px;cursor:pointer;font-size:16px;
  }
  .add-col-btn:hover{color:#fff;}

  .ability-desc{
    margin-top:8px;font-size:14px;font-style:italic;color:var(--text-dim);
    outline:none;cursor:text;line-height:1.45;
  }
  .ability-desc:empty:before{content:'optional rules text / description...';}

  .add-btn{
    background:transparent;border:1px dashed var(--line);color:var(--text-dim);
    width:100%;padding:9px;border-radius:var(--radius);cursor:pointer;
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  }
  .add-btn:hover{border-color:var(--accent);color:var(--accent);}

  .footer-bar{
    border-top:none;padding:16px 22px 20px;display:flex;
    align-items:center;gap:10px;
  }
  .divider-line{
    flex:1;height:1.5px;
    background:linear-gradient(90deg,transparent,var(--accent));
  }
  .divider-line.right{
    background:linear-gradient(90deg,var(--accent),transparent);
  }
  .footer-diamond{color:var(--accent);font-size:13px;flex-shrink:0;}
  .tags{display:flex;gap:0;align-items:center;flex-wrap:wrap;justify-content:center;flex-shrink:0;}
  .tag{
    background:none;border:none;padding:0 12px 0 0;font-size:11px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);
    outline:none;cursor:text;position:relative;
  }
  .tag:not(:last-child)::after{
    content:'·';position:absolute;right:3px;color:var(--accent-dim);
  }
  .tag .tag-x{
    margin-left:5px;color:var(--text-dim);cursor:pointer;font-size:10px;
  }
  .tag-add{
    background:none;border:1px dashed var(--line);color:var(--text-dim);
    border-radius:4px;padding:3px 8px;font-size:12px;cursor:pointer;flex-shrink:0;
  }

  /* ---- PASSIVES COLUMN ---- */
  .passives-col{background:var(--panel);padding:16px 13px;display:flex;flex-direction:column;min-height:0;}
  #passivesList{
    max-height:560px;overflow-y:auto;padding-right:6px;
  }
  #passivesList::-webkit-scrollbar{width:7px;}
  #passivesList::-webkit-scrollbar-track{background:transparent;}
  #passivesList::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
  #passivesList::-webkit-scrollbar-thumb:hover{background:var(--accent-dim);}
  .passives-col .section-label{margin-bottom:12px;}
  .show-toggle{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text-dim);cursor:pointer;text-transform:none;letter-spacing:0;}
  .show-toggle input{accent-color:var(--accent);cursor:pointer;}

  .passive-card{
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:11px;margin-bottom:10px;position:relative;overflow:hidden;
  }
  .passive-top{display:flex;align-items:flex-start;gap:10px;}
  .passive-icon{
    width:68px;height:68px;
    background:#000;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    overflow:hidden;color:var(--text-dim);font-size:11px;flex-shrink:0;
  }
  .passive-icon.shape-circle{border-radius:50%;}
  .passive-icon.shape-square{border-radius:5px;}
  .shape-toggle{
    font-size:9px;color:var(--text-dim);background:none;border:1px solid var(--line);
    border-radius:3px;padding:1px 4px;cursor:pointer;margin-top:4px;
  }
  .passive-name{
    font-family:Georgia,'Times New Roman',serif;font-weight:700;
    font-size:18px;
    outline:none;cursor:text;
  }
  .passive-desc{
    font-size:15px;color:var(--text-dim);margin-top:5px;
    outline:none;cursor:text;line-height:1.5;
  }
  .passive-desc:empty:before{content:'passive/ability text...';}
  .passive-remove{
    position:absolute;top:6px;right:6px;background:none;border:none;color:var(--text-dim);
    cursor:pointer;font-size:13px;z-index:4;
  }
  .passive-remove:hover{color:var(--danger);}
  .passives-empty{
    color:var(--text-dim);font-size:11.5px;text-align:center;padding:20px 6px;
    border:1px dashed var(--line);border-radius:6px;
  }
  .ultimate-toggle{
    position:absolute;top:6px;right:26px;background:none;border:none;
    color:var(--text-dim);cursor:pointer;font-size:13px;z-index:4;
  }
  .ultimate-toggle.active{color:var(--accent);}
  .ultimate-badge{
    display:none;position:absolute;top:8px;left:8px;z-index:3;
    background:var(--accent);color:#fff;font-size:9px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:9px;
    outline:none;cursor:text;max-width:80%;
  }
  .passive-card.ultimate .ultimate-badge:empty{display:none;}
  .passive-card.ultimate{padding:0 0 12px;}
  .passive-card.ultimate .ultimate-badge{display:block;}
  .passive-card.ultimate .passive-top{flex-direction:column;align-items:stretch;gap:0;}
  .passive-card.ultimate .passive-icon{
    width:100%;height:150px;border-radius:0 !important;font-size:12px;margin:0;
  }
  .passive-card.ultimate .shape-toggle{display:none;}
  .passive-card.ultimate .passive-name{
    font-size:17px;text-align:center;margin-top:10px;padding:0 14px;
  }
  .passive-card.ultimate .passive-desc{
    text-align:center;margin-top:6px;padding:0 14px;
  }
  .passive-card.ultimate .cost-row{justify-content:center;padding:0 14px;}

  .cost-row{display:flex;align-items:center;gap:8px;margin-top:7px;}
  .cost-switch{position:relative;display:inline-block;width:30px;height:16px;flex-shrink:0;cursor:pointer;}
  .cost-switch input{opacity:0;width:0;height:0;position:absolute;}
  .cost-switch .track{
    position:absolute;inset:0;background:var(--line);border-radius:16px;transition:.15s;
  }
  .cost-switch .track:before{
    content:'';position:absolute;height:12px;width:12px;left:2px;top:2px;
    background:var(--text-dim);border-radius:50%;transition:.15s;
  }
  .cost-switch input:checked + .track{background:var(--accent-dim);}
  .cost-switch input:checked + .track:before{transform:translateX(14px);background:var(--accent);}
  .cost-tag{
    display:none;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--accent);
    background:var(--panel);border:1px solid var(--accent-dim);border-radius:5px;
    padding:2px 9px;outline:none;cursor:text;
  }
  .cost-tag.show{display:inline-block;}

  input[type=file]{display:none;}

  /* ---- FLOATING SETTINGS ---- */
  .settings-fab{
    position:fixed;top:50%;right:20px;transform:translateY(-50%);
    z-index:100;display:flex;flex-direction:column;align-items:flex-end;gap:10px;
  }
  .settings-gear{
    width:46px;height:46px;border-radius:50%;background:var(--panel-2);
    border:1px solid var(--line);color:var(--text);font-size:19px;cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,.5);
  }
  .settings-gear:hover{border-color:var(--accent);color:var(--accent);}
  .settings-panel{
    display:none;background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:14px;width:210px;box-shadow:0 14px 34px rgba(0,0,0,.55);
  }
  .settings-panel.open{display:block;}
  .settings-title{
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);
    margin-bottom:10px;
  }
  .settings-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:12.5px;color:var(--text);cursor:pointer;
  }
  .settings-row input{accent-color:var(--accent);cursor:pointer;width:16px;height:16px;}
  .settings-divider{height:1px;background:var(--line);margin:12px 0;}

  /* ---- EXPORT MODE: hide editing-only chrome ---- */
  #card.exporting .art-controls,
  #card.exporting .art-remove-btn,
  #card.exporting .add-icon-tile,
  #card.exporting .heat-add-tile,
  #card.exporting .slot-remove,
  #card.exporting .add-stat-tile,
  #card.exporting .stat-x,
  #card.exporting .slot-x,
  #card.exporting .add-btn,
  #card.exporting .ability-remove,
  #card.exporting .ability-color-btn,
  #card.exporting .col-x,
  #card.exporting .add-col-btn,
  #card.exporting .tag-x,
  #card.exporting .tag-add,
  #card.exporting .passive-remove,
  #card.exporting .shape-toggle,
  #card.exporting .ultimate-toggle,
  #card.exporting .trait-toggle,
  #card.exporting .cost-switch,
  #card.exporting .show-toggle,
  #card.exporting .passives-empty,
  #card.exporting .art-placeholder{
    display:none !important;
  }
  #card.exporting #abilitiesList,
  #card.exporting #passivesList{
    max-height:none !important;
    overflow:visible !important;
    padding-right:0 !important;
  }
  #card.exporting *{cursor:default !important;}
  /* Instead of computing an exact pixel width in JS (fragile — one bad
     measurement and content gets clipped or squeezed), let the browser size
     the card to fit its own content naturally. width:max-content means the
     card becomes exactly as wide as it needs to be for every column's
     content to render at full, unshrunk size — guaranteed correct because
     it's the browser's own layout engine doing the math, not ours. */
  #card.exporting{
    width:max-content !important;
    max-width:none !important;
  }
  #card.exporting .stat-columns{overflow-x:visible;}
  #card.exporting .stat-columns.empty{display:none;}
  #card.exporting #unitName:empty:before,
  #card.exporting #subtitleText:empty:before,
  #card.exporting .ability-desc:empty:before,
  #card.exporting .passive-desc:empty:before{
    content:'' !important;
  }
</style>
</head>
<body>

<div class="page-frame" aria-hidden="true"></div>

  <div class="global-btns">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
let uid = 0;
const newId = () => 'n' + (++uid);

function readFileAsDataURL(file, cb){
  const reader = new FileReader();
  reader.onload = e => cb(e.target.result);
  reader.readAsDataURL(file);
}
function makeUploadable(container, onLoad){
  const input = container.querySelector('input[type=file]');
  container.addEventListener('click', (e)=>{
    if(e.target === input) return;
    input.click();
  });
  input.addEventListener('click', e => e.stopPropagation());
  input.addEventListener('change', e => {
    const file = e.target.files[0];
    if(file) readFileAsDataURL(file, onLoad);
  });
}
/* Same as makeUploadable, but requires a double-click to open the file picker.
   Used for the small circular icons (stats bar, passives) that sit close
   together and were popping the upload dialog too easily on an ordinary
   click meant for something else nearby. */
function makeUploadableDblClick(container, onLoad){
  const input = container.querySelector('input[type=file]');
  container.addEventListener('dblclick', (e)=>{
    if(e.target === input) return;
    input.click();
  });
  input.addEventListener('click', e => e.stopPropagation());
  input.addEventListener('change', e => {
    const file = e.target.files[0];
    if(file) readFileAsDataURL(file, onLoad);
  });
}
function attachImageDragZoom(container){
  const state = {x:0, y:0, scale:1, natW:0, natH:0, dataUrl:null};
  let dragging = false, moved = false, startX=0, startY=0, baseX=0, baseY=0;
  function apply(){
    if(!state.dataUrl || !state.natW || !state.natH) return;
    const rect = container.getBoundingClientRect();
    if(rect.width < 1 || rect.height < 1) return;
    const containScale = Math.min(rect.width / state.natW, rect.height / state.natH);
    const renderedW = state.natW * containScale * state.scale;
    const renderedH = state.natH * containScale * state.scale;
    container.style.backgroundSize = `${renderedW}px ${renderedH}px`;
    const posX = rect.width / 2 + state.x;
    const posY = rect.height / 2 + state.y;
    container.style.backgroundPosition = `${posX}px ${posY}px`;
  }
  if(typeof ResizeObserver !== 'undefined'){
    const ro = new ResizeObserver(()=> apply());
    ro.observe(container);
  }
  container.style.cursor = 'pointer';
  container.addEventListener('mousedown', e=>{
    if(!state.dataUrl) return;
    dragging = true; moved = false;
    startX = e.clientX; startY = e.clientY; baseX = state.x; baseY = state.y;
    container.style.cursor = 'grabbing';
    e.preventDefault();
  });
  window.addEventListener('mousemove', e=>{
    if(!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if(Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
    state.x = baseX + dx; state.y = baseY + dy;
    apply();
  });
  window.addEventListener('mouseup', ()=>{
    if(dragging){ dragging = false; container.style.cursor = 'pointer'; }
  });
  container.addEventListener('click', e=>{
    if(moved){ e.stopImmediatePropagation(); e.preventDefault(); }
    moved = false;
  });
  container.addEventListener('wheel', e=>{
    if(!state.dataUrl) return;
    e.preventDefault();
    state.scale = Math.max(0.3, Math.min(6, state.scale - e.deltaY / 500));
    apply();
  }, {passive:false});
  return {
    setImage(dataUrl){
      const probe = new Image();
      probe.onload = ()=>{
        state.dataUrl = dataUrl; state.natW = probe.naturalWidth; state.natH = probe.naturalHeight;
        state.x = 0; state.y = 0; state.scale = 1;
        container.style.backgroundImage = `url(${dataUrl})`;
        container.style.backgroundRepeat = 'no-repeat';
        apply();
      };
      probe.src = dataUrl;
    },
    clearImage(){
      state.dataUrl = null; state.natW = 0; state.natH = 0; state.x = 0; state.y = 0; state.scale = 1;
      container.style.backgroundImage = '';
    },
    reset(){ state.x = 0; state.y = 0; state.scale = 1; apply(); },
    refit(){ apply(); }
  };
}
function editable(tag, cls, text){
  const el = document.createElement(tag);
  el.className = cls;
  el.contentEditable = true;
  el.spellcheck = false;
  el.textContent = text;
  return el;
}

const artFrame = document.getElementById('artFrame');
const artPlaceholder = document.getElementById('artPlaceholder');
const artRemoveBtn = document.getElementById('artRemoveBtn');
const artUpload = document.getElementById('artUpload');
const zoomSlider = document.getElementById('zoomSlider');

let art = {x:0, y:0, scale:1, loaded:false, natW:0, natH:0};
let dragging = false, dragStartX=0, dragStartY=0, startArtX=0, startArtY=0;

function updateArtTransform(){
  if(!art.loaded || !art.natW || !art.natH) return;
  const rect = artFrame.getBoundingClientRect();
  if(rect.width < 1 || rect.height < 1) return;
  const containScale = Math.min(rect.width / art.natW, rect.height / art.natH);
  const renderedW = art.natW * containScale * art.scale;
  const renderedH = art.natH * containScale * art.scale;
  artFrame.style.backgroundSize = `${renderedW}px ${renderedH}px`;
  const posX = rect.width / 2 + art.x;
  const posY = rect.height / 2 + art.y;
  artFrame.style.backgroundPosition = `${posX}px ${posY}px`;
}
if(typeof ResizeObserver !== 'undefined'){
  const artFrameRO = new ResizeObserver(()=> updateArtTransform());
  artFrameRO.observe(artFrame);
}
function loadArtImage(dataUrl){
  const probe = new Image();
  probe.onload = ()=>{
    art = {x:0, y:0, scale:1, loaded:true, natW:probe.naturalWidth, natH:probe.naturalHeight};
    artFrame.style.backgroundImage = `url(${dataUrl})`;
    artFrame.style.backgroundRepeat = 'no-repeat';
    artPlaceholder.style.display = 'none';
    artRemoveBtn.style.display = 'flex';
    zoomSlider.value = 100;
    updateArtTransform();
  };
  probe.src = dataUrl;
}
artFrame.addEventListener('click', (e)=>{
  if(art.loaded) return;
  if(e.target === artRemoveBtn) return;
  artUpload.click();
});
artUpload.addEventListener('change', e=>{
  const file = e.target.files[0];
  if(file) readFileAsDataURL(file, loadArtImage);
});
artRemoveBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  artFrame.style.backgroundImage = '';
  artPlaceholder.style.display = 'flex';
  artRemoveBtn.style.display = 'none';
  art = {x:0, y:0, scale:1, loaded:false, natW:0, natH:0};
  artUpload.value = '';
});
artFrame.addEventListener('mousedown', e=>{
  if(!art.loaded) return;
  dragging = true;
  artFrame.classList.add('dragging');
  dragStartX = e.clientX; dragStartY = e.clientY;
  startArtX = art.x; startArtY = art.y;
});
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  art.x = startArtX + (e.clientX - dragStartX);
  art.y = startArtY + (e.clientY - dragStartY);
  updateArtTransform();
});
window.addEventListener('mouseup', ()=>{
  dragging = false;
  artFrame.classList.remove('dragging');
});
artFrame.addEventListener('wheel', e=>{
  if(!art.loaded) return;
  e.preventDefault();
  let val = parseFloat(zoomSlider.value) - e.deltaY/4;
  val = Math.max(30, Math.min(600, val));
  zoomSlider.value = val;
  art.scale = val/100;
  updateArtTransform();
}, {passive:false});
zoomSlider.addEventListener('input', ()=>{
  art.scale = zoomSlider.value/100;
  updateArtTransform();
});
window.addEventListener('resize', updateArtTransform);

const iconStrip = document.getElementById('iconStrip');

function addIconTile(){
  const slot = document.createElement('div');
  slot.className = 'icon-slot';
  slot.title = 'Double-click to upload';
  slot.innerHTML = `<span class="plus">+</span><button class="slot-x">✕</button><input type="file" accept="image/*">`;
  const plus = slot.querySelector('.plus');
  const xBtn = slot.querySelector('.slot-x');
  const interactive = attachImageDragZoom(slot);
  makeUploadableDblClick(slot, dataUrl=>{
    interactive.setImage(dataUrl);
    plus.style.display='none';
  });
  xBtn.addEventListener('click', e=>{
    e.stopPropagation();
    slot.remove();
  });
  iconStrip.insertBefore(slot, addTile);
}
const addTile = document.createElement('button');
addTile.className = 'add-icon-tile';
addTile.textContent = '+';
addTile.title = 'Add icon slot';
addTile.addEventListener('click', addIconTile);
iconStrip.appendChild(addTile);
for(let i=0;i<3;i++) addIconTile();

const typeSelect = document.getElementById('typeSelect');
const typeLabelExport = document.getElementById('typeLabelExport');
typeSelect.value = 'BATTLECOMMANDER';
typeLabelExport.textContent = typeSelect.value;
function applyTypeLayout(){
  const wide = typeSelect.value === 'VEHICLE' || typeSelect.value === 'SQUAD';
  cardEl.classList.toggle('type-wide-art', wide);
  typeLabelExport.textContent = typeSelect.value;
  updateArtTransform();
}
typeSelect.addEventListener('change', applyTypeLayout);

const statsRow = document.getElementById('statsRow');
const addStatTile = document.createElement('button');
addStatTile.className = 'add-stat-tile';
addStatTile.textContent = '+';
addStatTile.title = 'Add stat';
addStatTile.addEventListener('click', ()=> addStatBlock('0','STAT'));
statsRow.appendChild(addStatTile);

function addStatBlock(value, label){
  const block = document.createElement('div');
  block.className = 'stat-block';
  block.innerHTML = `
    <button class="stat-x">✕</button>
    <div class="stat-icon" title="Double-click to upload"><span>+</span><input type="file" accept="image/*"></div>
    <div class="stat-value" contenteditable spellcheck="false">${value}</div>
    <div class="stat-label" contenteditable spellcheck="false">${label}</div>
  `;
  const iconBox = block.querySelector('.stat-icon');
  const iconSpan = iconBox.querySelector('span');
  const statIconInteractive = attachImageDragZoom(iconBox);
  makeUploadableDblClick(iconBox, dataUrl=>{
    statIconInteractive.setImage(dataUrl);
    iconSpan.style.display='none';
  });
  block.querySelector('.stat-x').addEventListener('click', ()=> block.remove());
  statsRow.insertBefore(block, addStatTile);
}
// Stats row starts blank — click + to add stats (Health, Move, etc.)

const abilitiesList = document.getElementById('abilitiesList');
const abilityPalette = ['#e05252','#8b5cf6','#3b82f6','#22c55e','#f5a623','#ec4899','#20c9c9'];
let abilityPaletteIdx = 0;
let coloredAbilitiesEnabled = false;
function nextAbilityColor(){
  const c = abilityPalette[abilityPaletteIdx % abilityPalette.length];
  abilityPaletteIdx++;
  return c;
}
function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function applyAbilityColorState(card){
  const hex = card.dataset.color || '#e8912e';
  if(coloredAbilitiesEnabled){
    card.style.background = `linear-gradient(90deg, ${hexToRgba(hex,0.28)} 0%, ${hexToRgba(hex,0.10)} 45%, var(--panel-2) 85%)`;
    card.style.borderColor = hexToRgba(hex,0.5);
  } else {
    card.style.background = '';
    card.style.borderColor = '';
  }
}
function fixIconStripSquaresForExport(){
  document.querySelectorAll('#iconStrip .icon-slot, #iconStrip .add-icon-tile').forEach(el=>{
    const w = el.getBoundingClientRect().width;
    el.style.height = w + 'px';
  });
}
function resetIconStripSquares(){
  document.querySelectorAll('#iconStrip .icon-slot, #iconStrip .add-icon-tile').forEach(el=> el.style.height = '');
}
/* Widens the art column AND passives column proportionally to ability count
   (uncapped), purely for visual balance so neither looks cramped/slim next to
   a tall card. The card's OVERALL width is no longer computed here —
   #card.exporting{width:max-content} in CSS handles guaranteeing every column
   fits at full size, which is far more reliable than manually measuring and
   summing pixel widths in JS. */
function applyExportSizing(){
  const abilityCount = abilitiesList.children.length;
  const extra = Math.max(0, abilityCount - 3);
  const scale = 1 + extra * 0.15;
  const isWide = cardEl.classList.contains('type-wide-art');
  const artBase = isWide ? 460 : 420;
  const newArtWidth = Math.round(artBase * scale);
  const artCol = document.querySelector('.art-col');
  artCol.style.width = newArtWidth + 'px';
  artCol.style.flex = `0 0 ${newArtWidth}px`;

  const passivesBase = 380;
  const newPassivesWidth = Math.round(passivesBase * scale);
  const passivesColEl = document.getElementById('passivesCol');
  passivesColEl.style.width = newPassivesWidth + 'px';
  passivesColEl.style.flex = `0 0 ${newPassivesWidth}px`;
}
function resetExportSizing(){
  const artCol = document.querySelector('.art-col');
  artCol.style.width = '';
  artCol.style.flex = '';
  const passivesColEl = document.getElementById('passivesCol');
  passivesColEl.style.width = '';
  passivesColEl.style.flex = '';
  cardEl.style.width = '';
}
document.getElementById('addAbilityBtn').addEventListener('click', ()=>{
  addAbilityCard({name:'New Ability', tag:'MELEE', desc:'', cols:[['0','ATK'],['0','HIT']], color:nextAbilityColor()});
});

function addAbilityCard(data){
  const card = document.createElement('div');
  card.className = 'ability-card';
  card.innerHTML = `
    <button class="ability-color-btn" title="Ability color"><input type="color" value="${data.color||'#e8912e'}"></button>
    <button class="trait-toggle" title="Mark as a faction/class Trait">◆</button>
    <button class="ability-remove">✕</button>
    <div class="trait-badge" contenteditable spellcheck="false">Trait</div>
    <div class="ability-top">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;">
        <div class="ability-icon shape-square" title="Double-click to upload"><span>ART</span><input type="file" accept="image/*"></div>
        <button class="shape-toggle" title="Square = ability, Circle = passive">■</button>
      </div>
      <div class="ability-headline">
        <div class="ability-name-row">
          <div class="ability-name" contenteditable spellcheck="false">${data.name}</div>
          <div class="ability-tag" contenteditable spellcheck="false">${data.tag}</div>
        </div>
        <div class="stat-columns"></div>
        <div class="ability-desc" contenteditable spellcheck="false">${data.desc||''}</div>
      </div>
    </div>
  `;
  const iconBox = card.querySelector('.ability-icon');
  const iconSpan = iconBox.querySelector('span');
  const abilityIconInteractive = attachImageDragZoom(iconBox);
  makeUploadableDblClick(iconBox, dataUrl=>{
    abilityIconInteractive.setImage(dataUrl);
    iconSpan.style.display='none';
  });
  const abilityShapeBtn = card.querySelector('.shape-toggle');
  abilityShapeBtn.addEventListener('click', ()=>{
    const isCircle = iconBox.classList.contains('shape-circle');
    iconBox.classList.toggle('shape-circle', !isCircle);
    iconBox.classList.toggle('shape-square', isCircle);
    abilityShapeBtn.textContent = isCircle ? '●' : '■';
  });
  card.querySelector('.ability-remove').addEventListener('click', ()=> card.remove());
  const traitBtn = card.querySelector('.trait-toggle');
  traitBtn.addEventListener('click', ()=>{
    const isTrait = card.classList.toggle('trait');
    traitBtn.classList.toggle('active', isTrait);
    abilityIconInteractive.refit();
  });

  const colorInput = card.querySelector('.ability-color-btn input[type=color]');
  const colorBtn = card.querySelector('.ability-color-btn');
  const initialColor = data.color || '#e8912e';
  card.dataset.color = initialColor;
  colorBtn.style.background = initialColor;
  applyAbilityColorState(card);
  colorInput.addEventListener('input', ()=>{
    card.dataset.color = colorInput.value;
    colorBtn.style.background = colorInput.value;
    applyAbilityColorState(card);
  });
  colorInput.addEventListener('click', e => e.stopPropagation());

  const colsWrap = card.querySelector('.stat-columns');
  function updateStatColumnsEmptyState(){
    const hasCols = colsWrap.querySelectorAll('.stat-col').length > 0;
    colsWrap.classList.toggle('empty', !hasCols);
  }
  function addCol(value, label){
    const col = document.createElement('div');
    col.className = 'stat-col';
    col.innerHTML = `
      <button class="col-x">✕</button>
      <div class="cval" contenteditable spellcheck="false">${value}</div>
      <div class="clabel" contenteditable spellcheck="false">${label}</div>
    `;
    col.querySelector('.col-x').addEventListener('click', ()=>{
      col.remove();
      updateStatColumnsEmptyState();
    });
    colsWrap.insertBefore(col, addColBtn);
    updateStatColumnsEmptyState();
  }
  const addColBtn = document.createElement('button');
  addColBtn.className = 'add-col-btn';
  addColBtn.textContent = '+';
  addColBtn.title = 'Add column (e.g. PRC, AP...)';
  addColBtn.addEventListener('click', ()=> addCol('0','NEW'));
  colsWrap.appendChild(addColBtn);
  data.cols.forEach(([v,l]) => addCol(v,l));
  updateStatColumnsEmptyState();

  abilitiesList.appendChild(card);
}

// Abilities list starts blank — click + Add Ability to create the first one

const tagsList = document.getElementById('tagsList');
function addTag(text){
  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.innerHTML = `<span contenteditable spellcheck="false" style="outline:none;">${text}</span><span class="tag-x">✕</span>`;
  tag.querySelector('.tag-x').addEventListener('click', ()=> tag.remove());
  tagsList.appendChild(tag);
}
document.getElementById('addTagBtn').addEventListener('click', ()=> addTag('NEW TAG'));
// Footer tags start blank — click + to add faction/keyword tags

const passivesList = document.getElementById('passivesList');
const passivesCol = document.getElementById('passivesCol');
const showPassivesToggle = document.getElementById('showPassivesToggle');
const togglePassivesColBtn = document.getElementById('togglePassivesColBtn');
const cardEl = document.getElementById('card');

function refreshPassivesEmptyState(){
  const existingEmpty = passivesList.querySelector('.passives-empty');
  if(existingEmpty) existingEmpty.remove();
  if(passivesList.children.length === 0){
    const empty = document.createElement('div');
    empty.className = 'passives-empty';
    empty.textContent = 'No passives yet — add one below.';
    passivesList.appendChild(empty);
  }
}

function addPassiveCard(data){
  const existingEmpty = passivesList.querySelector('.passives-empty');
  if(existingEmpty) existingEmpty.remove();

  const card = document.createElement('div');
  card.className = 'passive-card';
  card.innerHTML = `
    <button class="passive-remove">✕</button>
    <button class="ultimate-toggle" title="Mark as Ultimate (large banner icon)">★</button>
    <div class="ultimate-badge" contenteditable spellcheck="false">Ultimate</div>
    <div class="passive-top">
      <div style="display:flex;flex-direction:column;align-items:center;">
        <div class="passive-icon shape-${data.shape}" title="Double-click to upload"><span>+</span><input type="file" accept="image/*"></div>
        <button class="shape-toggle" title="Square = extra ability, Circle = passive">${data.shape==='circle'?'●':'■'}</button>
      </div>
      <div style="flex:1;min-width:0;">
        <div class="passive-name" contenteditable spellcheck="false">${data.name}</div>
        <div class="passive-desc" contenteditable spellcheck="false">${data.desc||''}</div>
        <div class="cost-row">
          <label class="cost-switch" title="Toggle cost">
            <input type="checkbox" class="cost-toggle">
            <span class="track"></span>
          </label>
          <span class="cost-tag" contenteditable spellcheck="false">Cost 20 CP</span>
        </div>
      </div>
    </div>
  `;
  const iconBox = card.querySelector('.passive-icon');
  const iconSpan = iconBox.querySelector('span');
  const passiveIconInteractive = attachImageDragZoom(iconBox);
  makeUploadableDblClick(iconBox, dataUrl=>{
    passiveIconInteractive.setImage(dataUrl);
    iconSpan.style.display='none';
  });
  const shapeBtn = card.querySelector('.shape-toggle');
  shapeBtn.addEventListener('click', ()=>{
    const isCircle = iconBox.classList.contains('shape-circle');
    iconBox.classList.toggle('shape-circle', !isCircle);
    iconBox.classList.toggle('shape-square', isCircle);
    shapeBtn.textContent = isCircle ? '■' : '●';
    passiveIconInteractive.refit();
  });
  const costToggle = card.querySelector('.cost-toggle');
  const costTag = card.querySelector('.cost-tag');
  costToggle.addEventListener('change', ()=>{
    costTag.classList.toggle('show', costToggle.checked);
  });
  card.querySelector('.passive-remove').addEventListener('click', ()=>{
    card.remove();
    refreshPassivesEmptyState();
  });
  const ultimateBtn = card.querySelector('.ultimate-toggle');
  ultimateBtn.addEventListener('click', ()=>{
    const isUltimate = card.classList.toggle('ultimate');
    ultimateBtn.classList.toggle('active', isUltimate);
    passiveIconInteractive.refit();
  });
  passivesList.appendChild(card);
}
document.getElementById('addPassiveBtn').addEventListener('click', ()=>{
  addPassiveCard({name:'New Passive', desc:'', shape:'circle'});
});

// Passives list starts blank — the empty-state message + Add button handle it
refreshPassivesEmptyState();

showPassivesToggle.addEventListener('change', ()=>{
  cardEl.classList.toggle('no-passives', !showPassivesToggle.checked);
  togglePassivesColBtn.textContent = showPassivesToggle.checked ? 'Hide Passives Column' : 'Show Passives Column';
});
togglePassivesColBtn.addEventListener('click', ()=>{
  showPassivesToggle.checked = !showPassivesToggle.checked;
  showPassivesToggle.dispatchEvent(new Event('change'));
});

const settingsGearBtn = document.getElementById('settingsGearBtn');
const settingsPanel = document.getElementById('settingsPanel');
const coloredAbilitiesToggle = document.getElementById('coloredAbilitiesToggle');

settingsGearBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  settingsPanel.classList.toggle('open');
});
document.addEventListener('click', (e)=>{
  if(!settingsPanel.contains(e.target) && e.target !== settingsGearBtn){
    settingsPanel.classList.remove('open');
  }
});
coloredAbilitiesToggle.addEventListener('change', ()=>{
  coloredAbilitiesEnabled = coloredAbilitiesToggle.checked;
  document.body.classList.toggle('colored-abilities', coloredAbilitiesEnabled);
  abilitiesList.querySelectorAll('.ability-card').forEach(applyAbilityColorState);
});

const battletechToggle = document.getElementById('battletechToggle');
const heatTrack = document.getElementById('heatTrack');
let heatSlotCount = 10;

function renderHeatTrack(){
  heatTrack.innerHTML = '';
  const bar = document.createElement('div');
  bar.className = 'heat-track-bar';
  for(let i = 0; i < heatSlotCount; i++){
    const slot = document.createElement('div');
    slot.className = 'heat-slot';
    const rm = document.createElement('button');
    rm.className = 'slot-remove';
    rm.textContent = '✕';
    rm.title = 'Remove slot';
    rm.addEventListener('click', (e)=>{
      e.stopPropagation();
      heatSlotCount = Math.max(1, heatSlotCount - 1);
      renderHeatTrack();
    });
    slot.appendChild(rm);
    bar.appendChild(slot);
  }
  heatTrack.appendChild(bar);
  const addTile = document.createElement('button');
  addTile.className = 'heat-add-tile';
  addTile.textContent = '+';
  addTile.title = 'Add heat slot';
  addTile.addEventListener('click', ()=>{
    heatSlotCount++;
    renderHeatTrack();
  });
  heatTrack.appendChild(addTile);
}
renderHeatTrack();
battletechToggle.addEventListener('change', ()=>{
  document.body.classList.toggle('battletech-enabled', battletechToggle.checked);
});

const downloadBtn = document.getElementById('downloadBtn');
downloadBtn.addEventListener('click', async ()=>{
  const originalLabel = downloadBtn.textContent;
  downloadBtn.textContent = 'Rendering…';
  downloadBtn.disabled = true;
  cardEl.classList.add('exporting');
  applyExportSizing();
  fixIconStripSquaresForExport();
  await new Promise(r => setTimeout(r, 80));
  updateArtTransform();
  await new Promise(r => setTimeout(r, 40));
  try{
    const fullWidth = cardEl.scrollWidth;
    const fullHeight = cardEl.scrollHeight;
    const canvas = await html2canvas(cardEl, {
      backgroundColor: '#232226',
      scale: 2,
      useCORS: true,
      width: fullWidth,
      height: fullHeight,
      windowWidth: fullWidth,
      windowHeight: fullHeight
    });
    const link = document.createElement('a');
    const nameText = document.getElementById('unitName').textContent.trim() || 'unit-card';
    link.download = nameText.replace(/[^a-z0-9\-_ ]/gi,'').trim().replace(/\s+/g,'-').toLowerCase() + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(err){
    alert('Could not render the card image. Try again.');
    console.error(err);
  } finally {
    cardEl.classList.remove('exporting');
    resetIconStripSquares();
    resetExportSizing();
    updateArtTransform();
    downloadBtn.textContent = originalLabel;
    downloadBtn.disabled = false;
  }
});

</script>
</body>
